name: ci
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres: {image: pgvector/pgvector:pg16, env: {POSTGRES_DB: appdb, POSTGRES_USER: app, POSTGRES_PASSWORD: app}, ports: ['5432:5432'], options: '--health-cmd="pg_isready -U app" --health-interval=5s --health-timeout=5s --health-retries=20'}
      redis: {image: 'redis:7.4-alpine', ports: ['6379:6379']}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: docker run -d --name nats-ci -p 4222:4222 nats:2.10-alpine -js
      - run: docker run -d --name minio-ci -p 9000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=change-me-minio-password minio/minio:latest server /data
      - run: pnpm lint && pnpm typecheck && pnpm test -- --runInBand && pnpm test:e2e && pnpm build && pnpm migration:validate
      - run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pydantic pytest ruff mypy && ruff check contracts tests/contracts && mypy && PYTHONPATH=. pytest tests/contracts -q
